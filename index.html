<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hunter Games</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="favicon.png">
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <img src="favicon.png" alt="" class="brand-logo">
        <span>Hunter Games</span>
      </div>
      <label class="search-wrap" aria-label="Search games">
        <input id="searchInput" type="search" placeholder="Search games" autocomplete="off">
      </label>
    </header>

    <main class="game-grid" id="gameGrid"></main>
    <p class="empty-state hidden" id="emptyState">No games match that search.</p>

    <div class="player-overlay" id="playerOverlay">
      <div class="player-bar">
        <span id="playerTitle"></span>
        <div class="player-bar-actions">
          <button id="blankBtn" type="button">Open in about:blank</button>
          <button id="closeBtn" type="button" aria-label="Close">✕</button>
        </div>
      </div>
      <iframe id="playerFrame" allow="fullscreen; autoplay; gamepad; pointer-lock" allowfullscreen></iframe>
    </div>

    <script src="games.js"></script>
    <script src="app.js"></script>
  </body>
</html>
